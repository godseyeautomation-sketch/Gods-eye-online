<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#CCFF00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E6FF66;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Eye icon -->
  <g transform="translate(256,256)">
    <!-- Outer eye shape -->
    <path d="M-160,0 Q-80,-100 0,-100 Q80,-100 160,0 Q80,100 0,100 Q-80,100 -160,0 Z" fill="#000000"/>
    <!-- Inner eye white -->
    <path d="M-120,0 Q-60,-70 0,-70 Q60,-70 120,0 Q60,70 0,70 Q-60,70 -120,0 Z" fill="url(#bg)"/>
    <!-- Iris -->
    <circle cx="0" cy="0" r="56" fill="#000000"/>
    <!-- Pupil highlight -->
    <circle cx="16" cy="-16" r="16" fill="#CCFF00"/>
  </g>
</svg>

steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/gods-eye-online:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/gods-eye-online:latest', '.']
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/gods-eye-online:$COMMIT_SHA']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/gods-eye-online:latest']
  
  # Deploy container image to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'gods-eye-online'
      - '--image=gcr.io/$PROJECT_ID/gods-eye-online:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=2Gi'
      - '--cpu=1'
      - '--timeout=300s'
      - '--max-instances=10'
      # min-instances=1 prevents Cloud Run from scaling down to zero, which
      # used to wipe ~/.klint/sync/*.json (brand_profiles, content_slots, etc.)
      # Without this, every cold start after idle deletes scout_report from the
      # local filesystem, causing Priya to fail with "No Scout research found"
      # immediately after a successful Scout + Approve flow.
      - '--min-instances=1'

images:
  - 'gcr.io/$PROJECT_ID/gods-eye-online:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/gods-eye-online:latest'

timeout: '1200s'

options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

